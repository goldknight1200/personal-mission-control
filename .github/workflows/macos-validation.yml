name: macOS Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Packages/MissionControlCore/**"
      - "PersonalMissionControl/**"
      - "PersonalMissionControlTests/**"
      - "PersonalMissionControl.xcodeproj/**"
      - "**/*.swift"
      - "**/Package.swift"
      - "**/Package.resolved"
      - "**/*.xcconfig"
      - "**/*.entitlements"
      - "**/Info.plist"
  push:
    branches:
      - main
      - "stabilize/**"
    paths:
      - ".github/workflows/**"
      - "Packages/MissionControlCore/**"
      - "PersonalMissionControl/**"
      - "PersonalMissionControlTests/**"
      - "PersonalMissionControl.xcodeproj/**"
      - "**/*.swift"
      - "**/Package.swift"
      - "**/Package.resolved"
      - "**/*.xcconfig"
      - "**/*.entitlements"
      - "**/Info.plist"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validation:
    name: Static, core, simulator, Debug, launch, and Release gates
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v6

      - name: Verify toolchain and print diagnostics
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs TestResults UIArtifacts

          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error title=Pinned Xcode unavailable::Expected $DEVELOPER_DIR on the macos-15 runner."
            find /Applications -maxdepth 1 -name "Xcode*.app" -print | sort
            exit 1
          fi

          sw_vers | tee Logs/macos-version.txt
          uname -m | tee Logs/runner-architecture.txt
          xcodebuild -version | tee Logs/xcode-version.txt
          swift --version | tee Logs/swift-version.txt
          xcrun simctl list devices available | tee Logs/simctl-devices.txt

      - name: Gate 6 — Static repository validation
        id: static_validation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee Logs/static-validation.log) 2>&1

          git diff --check
          git diff-tree --check --no-commit-id --root -r HEAD

          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo "::error title=Conflict marker detected::Remove unresolved merge markers."
            exit 1
          fi

          if git grep -nE \
            '(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' \
            -- .; then
            echo "::error title=Credential-shaped content detected::Remove committed credentials."
            exit 1
          fi

          if git ls-files | grep -E \
            '(^|/)(DerivedData[^/]*|\.build|build|TestResults|Logs|UIArtifacts)(/|$)|\.xcresult(/|$)'; then
            echo "::error title=Generated build output tracked::Remove generated build artifacts."
            exit 1
          fi

          if git grep -nE \
            '^import (SwiftUI|UIKit|AppKit|SwiftData|UserNotifications|Speech|HealthKit|EventKit|Intents|AppIntents|Security|AVFoundation)$' \
            -- Packages/MissionControlCore/Sources; then
            echo "::error title=Core layering violation::Apple application frameworks cannot enter the pure core package."
            exit 1
          fi

          test -f \
            PersonalMissionControl.xcodeproj/xcshareddata/xcschemes/PersonalMissionControl.xcscheme

          python3 <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re
          import sys

          roots = [
              Path("Packages/MissionControlCore/Sources"),
              Path("PersonalMissionControl"),
          ]
          declaration = re.compile(
              r"^(?:(?:public|internal|package|private|fileprivate|final|open|"
              r"indirect|nonisolated|@MainActor|@Observable)\s+)*"
              r"(?:class|struct|enum|actor|protocol)\s+([A-Za-z_][A-Za-z0-9_]*)"
          )
          declarations = defaultdict(list)
          for root in roots:
              for path in root.rglob("*.swift"):
                  for line_number, line in enumerate(
                      path.read_text(encoding="utf-8").splitlines(),
                      start=1,
                  ):
                      match = declaration.match(line)
                      if match:
                          declarations[match.group(1)].append(
                              f"{path}:{line_number}"
                          )

          duplicates = {
              name: locations
              for name, locations in declarations.items()
              if len(locations) > 1
          }
          if duplicates:
              for name, locations in sorted(duplicates.items()):
                  print(f"Duplicate production type {name}:")
                  for location in locations:
                      print(f"  {location}")
              sys.exit(1)
          PY

          swift package \
            --package-path Packages/MissionControlCore \
            resolve
          xcodebuild \
            -project PersonalMissionControl.xcodeproj \
            -scheme PersonalMissionControl \
            -list \
            -json \
            | tee Logs/xcode-project-list.json
          xcodebuild \
            -project PersonalMissionControl.xcodeproj \
            -scheme PersonalMissionControl \
            -resolvePackageDependencies \
            | tee Logs/xcode-package-resolution.log

      - name: Gate 1 — Core Swift package tests
        id: core_tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/MissionControlCore 2>&1 \
            | tee Logs/core-package-tests.log

      - name: Select available representative iPhone simulators
        id: simulator
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > Logs/simctl-devices.json

          python3 <<'PY'
          import json
          import os
          import re
          import sys

          with open("Logs/simctl-devices.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          candidates = []
          for runtime_id, devices in payload.get("devices", {}).items():
              match = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime_id)
              if not match:
                  continue
              runtime_version = tuple(int(value or 0) for value in match.groups())
              if runtime_version[0] < 17:
                  continue

              for device in devices:
                  name = device.get("name", "")
                  if not name.startswith("iPhone"):
                      continue
                  if not device.get("isAvailable", True):
                      continue
                  udid = device.get("udid")
                  if not udid:
                      continue

                  model_match = re.search(r"iPhone\s+(\d+)", name)
                  model_number = int(model_match.group(1)) if model_match else 0
                  if "Pro Max" in name:
                      model_tier = 4
                  elif "Pro" in name:
                      model_tier = 3
                  elif "Plus" in name:
                      model_tier = 2
                  elif "SE" in name:
                      model_tier = 0
                  else:
                      model_tier = 1

                  candidates.append(
                      (
                          runtime_version,
                          model_number,
                          model_tier,
                          name,
                          udid,
                          runtime_id,
                      )
                  )

          if not candidates:
              print(
                  "::error title=Simulator selection failed::"
                  "No available iPhone simulator with iOS 17 or newer was found.",
                  file=sys.stderr,
              )
              sys.exit(1)

          selected = max(candidates)
          runtime_version, _, _, name, udid, runtime_id = selected
          print(f"Selected test device: {name} ({udid}) on {runtime_id}")

          latest_runtime = max(candidate[0] for candidate in candidates)
          ui_pool = [
              candidate
              for candidate in candidates
              if candidate[0] == latest_runtime
          ]
          small = min(
              ui_pool,
              key=lambda candidate: (
                  candidate[2],
                  candidate[1],
                  candidate[3],
                  candidate[4],
              ),
          )
          large = max(
              ui_pool,
              key=lambda candidate: (
                  candidate[2],
                  candidate[1],
                  candidate[3],
                  candidate[4],
              ),
          )
          used_udids = {small[4], large[4]}
          common_pool = [
              candidate
              for candidate in ui_pool
              if candidate[4] not in used_udids
              and candidate[2] in (1, 3)
          ]
          if not common_pool:
              common_pool = [
                  candidate
                  for candidate in ui_pool
                  if candidate[4] not in used_udids
              ]
          common = max(
              common_pool,
              key=lambda candidate: (
                  candidate[1],
                  candidate[2],
                  candidate[3],
                  candidate[4],
              ),
          ) if common_pool else None

          ui_devices = [
              ("small", small),
              ("common", common),
              ("large", large),
          ]
          if common is None:
              print(
                  "::error title=Representative simulator selection failed::"
                  "The newest iOS runtime needs three distinct iPhone profiles."
              )
              sys.exit(1)

          print(
              "Launch profiles: "
              + ", ".join(
                  f"{label}={device[3]} ({device[4]})"
                  for label, device in ui_devices
              )
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={udid}\n")
              output.write(f"name={name}\n")
              output.write(f"runtime={runtime_id}\n")
              for label, device in ui_devices:
                  output.write(f"{label}_udid={device[4]}\n")
                  output.write(f"{label}_name={device[3]}\n")
          PY

      - name: Gate 2 — Complete iOS simulator test suite
        id: simulator_tests
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PersonalMissionControl.xcodeproj \
            -scheme PersonalMissionControl \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData-Tests \
            -resultBundlePath TestResults/PersonalMissionControlTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 \
            | tee Logs/ios-simulator-tests.log

      - name: Gate 3 — Unsigned Debug simulator build
        id: debug_build
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PersonalMissionControl.xcodeproj \
            -scheme PersonalMissionControl \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData-Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 \
            | tee Logs/ios-debug-build.log

      - name: Gate 5 — Debug launch and representative-size UI smoke
        id: launch_smoke
        if: >-
          ${{
            always()
            && steps.debug_build.outcome == 'success'
            && steps.simulator.outputs.small_udid != ''
            && steps.simulator.outputs.common_udid != ''
            && steps.simulator.outputs.large_udid != ''
          }}
        shell: bash
        env:
          APP_PATH: DerivedData-Debug/Build/Products/Debug-iphonesimulator/PersonalMissionControl.app
          BUNDLE_ID: com.ethanshahzad.PersonalMissionControl
        run: |
          set -euo pipefail
          exec > >(tee Logs/launch-smoke.log) 2>&1

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error title=Debug app missing::Expected $APP_PATH after the Debug build."
            exit 1
          fi

          run_simctl() {
            python3 - "$@" <<'PY'
          import subprocess
          import sys

          command = ["xcrun", "simctl", *sys.argv[1:]]
          try:
              subprocess.run(command, check=True, timeout=180)
          except subprocess.TimeoutExpired:
              print(
                  "::error title=simctl command timed out::"
                  + " ".join(command)
                  + " exceeded 180 seconds.",
                  file=sys.stderr,
              )
              sys.exit(124)
          except subprocess.CalledProcessError as error:
              sys.exit(error.returncode)
          PY
          }

          smoke_profile() {
            local label="$1"
            local udid="$2"
            local name="$3"
            echo "Launching $label profile: $name ($udid)"
            run_simctl boot "$udid" 2>/dev/null || true
            if ! run_simctl bootstatus "$udid" -b; then
              echo "::error title=Simulator boot timed out::$name ($udid) did not become ready within 180 seconds."
              return 1
            fi
            run_simctl uninstall "$udid" "$BUNDLE_ID" 2>/dev/null || true
            run_simctl install "$udid" "$APP_PATH"
            run_simctl status_bar "$udid" override --time "9:41"
            run_simctl launch \
              --terminate-running-process \
              "$udid" \
              "$BUNDLE_ID"
            sleep 5
            run_simctl io \
              "$udid" \
              screenshot \
              "UIArtifacts/${label}.png"
            run_simctl get_app_container "$udid" "$BUNDLE_ID" app
            run_simctl terminate "$udid" "$BUNDLE_ID"
            run_simctl shutdown "$udid"
          }

          smoke_profile \
            "small" \
            "${{ steps.simulator.outputs.small_udid }}" \
            "${{ steps.simulator.outputs.small_name }}"
          smoke_profile \
            "common" \
            "${{ steps.simulator.outputs.common_udid }}" \
            "${{ steps.simulator.outputs.common_name }}"
          smoke_profile \
            "large" \
            "${{ steps.simulator.outputs.large_udid }}" \
            "${{ steps.simulator.outputs.large_name }}"

      - name: Gate 4 — Unsigned Release simulator build
        id: release_build
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PersonalMissionControl.xcodeproj \
            -scheme PersonalMissionControl \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData-Release \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 \
            | tee Logs/ios-release-build.log

      - name: Summarize validation gates
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## macOS validation gates"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| Toolchain | ${{ steps.toolchain.outcome }} |"
            echo "| Static repository validation | ${{ steps.static_validation.outcome }} |"
            echo "| Core Swift package tests | ${{ steps.core_tests.outcome }} |"
            echo "| Simulator selection | ${{ steps.simulator.outcome }} |"
            echo "| Complete iOS simulator tests | ${{ steps.simulator_tests.outcome }} |"
            echo "| Unsigned Debug build | ${{ steps.debug_build.outcome }} |"
            echo "| Debug representative-size launch smoke | ${{ steps.launch_smoke.outcome }} |"
            echo "| Unsigned Release build | ${{ steps.release_build.outcome }} |"
            echo
            echo "Test simulator: ${{ steps.simulator.outputs.name }}"
            echo "Runtime: ${{ steps.simulator.outputs.runtime }}"
            echo "Launch profiles: ${{ steps.simulator.outputs.small_name }}, ${{ steps.simulator.outputs.common_name }}, ${{ steps.simulator.outputs.large_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload launch-smoke screenshots
        if: ${{ always() && steps.launch_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: launch-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: UIArtifacts/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-validation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Logs/
            TestResults/*.xcresult
            UIArtifacts/
          if-no-files-found: ignore
          retention-days: 7
