name: macOS Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Packages/MissionControlCore/**"
      - "PersonalMissionControl/**"
      - "PersonalMissionControlTests/**"
      - "PersonalMissionControl.xcodeproj/**"
      - "**/*.swift"
      - "**/Package.swift"
      - "**/Package.resolved"
      - "**/*.xcconfig"
      - "**/*.entitlements"
      - "**/Info.plist"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "Packages/MissionControlCore/**"
      - "PersonalMissionControl/**"
      - "PersonalMissionControlTests/**"
      - "PersonalMissionControl.xcodeproj/**"
      - "**/*.swift"
      - "**/Package.swift"
      - "**/Package.resolved"
      - "**/*.xcconfig"
      - "**/*.entitlements"
      - "**/Info.plist"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Core, simulator, and Release gates
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v6

      - name: Verify toolchain and print diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Logs TestResults

          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error title=Pinned Xcode unavailable::Expected $DEVELOPER_DIR on the macos-15 runner."
            find /Applications -maxdepth 1 -name "Xcode*.app" -print | sort
            exit 1
          fi

          sw_vers
          uname -m
          xcodebuild -version
          swift --version
          xcrun simctl list devices available | tee Logs/simctl-devices.txt

      - name: Gate 1 — Core Swift package tests
        id: core_tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path Packages/MissionControlCore 2>&1 \
            | tee Logs/core-package-tests.log

      - name: Select an available modern iPhone simulator
        id: simulator
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > Logs/simctl-devices.json

          python3 <<'PY'
          import json
          import os
          import re
          import sys

          with open("Logs/simctl-devices.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          candidates = []
          for runtime_id, devices in payload.get("devices", {}).items():
              match = re.search(r"\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime_id)
              if not match:
                  continue
              runtime_version = tuple(int(value or 0) for value in match.groups())
              if runtime_version[0] < 17:
                  continue

              for device in devices:
                  name = device.get("name", "")
                  if not name.startswith("iPhone"):
                      continue
                  if not device.get("isAvailable", True):
                      continue
                  udid = device.get("udid")
                  if not udid:
                      continue

                  model_match = re.search(r"iPhone\s+(\d+)", name)
                  model_number = int(model_match.group(1)) if model_match else 0
                  if "Pro Max" in name:
                      model_tier = 4
                  elif "Pro" in name:
                      model_tier = 3
                  elif "Plus" in name:
                      model_tier = 2
                  elif "SE" in name:
                      model_tier = 0
                  else:
                      model_tier = 1

                  candidates.append(
                      (
                          runtime_version,
                          model_number,
                          model_tier,
                          name,
                          udid,
                          runtime_id,
                      )
                  )

          if not candidates:
              print(
                  "::error title=Simulator selection failed::"
                  "No available iPhone simulator with iOS 17 or newer was found.",
                  file=sys.stderr,
              )
              sys.exit(1)

          selected = max(candidates)
          runtime_version, _, _, name, udid, runtime_id = selected
          runtime = ".".join(str(value) for value in runtime_version[:2])
          print(f"Selected {name} on iOS {runtime} ({udid})")

          latest_runtime = max(candidate[0] for candidate in candidates)
          ui_pool = [
              candidate
              for candidate in candidates
              if candidate[0] == latest_runtime
          ]
          small = min(
              ui_pool,
              key=lambda candidate: (
                  candidate[2],
                  candidate[1],
                  candidate[3],
                  candidate[4],
              ),
          )
          large = max(
              ui_pool,
              key=lambda candidate: (
                  candidate[2],
                  candidate[1],
                  candidate[3],
                  candidate[4],
              ),
          )
          used_udids = {small[4], large[4]}
          common_pool = [
              candidate
              for candidate in ui_pool
              if candidate[4] not in used_udids
              and candidate[2] in (1, 3)
          ]
          if not common_pool:
              common_pool = [
                  candidate
                  for candidate in ui_pool
                  if candidate[4] not in used_udids
              ]
          common = max(
              common_pool,
              key=lambda candidate: (
                  candidate[1],
                  candidate[2],
                  candidate[3],
                  candidate[4],
              ),
          ) if common_pool else None

          ui_devices = [
              ("small", small),
              ("common", common),
              ("large", large),
          ]
          if common is not None:
              print(
                  "UI smoke profiles: "
                  + ", ".join(
                      f"{label}={device[3]} ({device[4]})"
                      for label, device in ui_devices
                  )
              )
          else:
              print(
                  "::warning title=Three-profile UI smoke unavailable::"
                  "The newest iOS runtime has fewer than three distinct "
                  "available iPhone simulators."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={udid}\n")
              output.write(f"name={name}\n")
              output.write(f"runtime={runtime_id}\n")
              for label, device in ui_devices:
                  if device is None:
                      continue
                  output.write(f"{label}_udid={device[4]}\n")
                  output.write(f"{label}_name={device[3]}\n")
          PY

      - name: Gate 2 — iOS simulator tests
        id: simulator_tests
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PersonalMissionControl.xcodeproj \
            -scheme PersonalMissionControl \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/PersonalMissionControlTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 \
            | tee Logs/ios-simulator-tests.log

      - name: Debug launch and multi-size UI smoke
        id: ui_smoke
        if: >-
          ${{
            always()
            && steps.simulator_tests.outcome == 'success'
            && steps.simulator.outputs.small_udid != ''
            && steps.simulator.outputs.common_udid != ''
            && steps.simulator.outputs.large_udid != ''
          }}
        shell: bash
        env:
          APP_PATH: DerivedData/Build/Products/Debug-iphonesimulator/PersonalMissionControl.app
          BUNDLE_ID: com.ethanshahzad.PersonalMissionControl
        run: |
          set -euo pipefail
          mkdir -p Logs UIArtifacts
          exec > >(tee Logs/ui-smoke.log) 2>&1

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error title=Debug app missing::Expected $APP_PATH after simulator tests."
            exit 1
          fi

          smoke_profile() {
            local label="$1"
            local udid="$2"
            local name="$3"
            echo "Launching $label profile: $name ($udid)"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl uninstall "$udid" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl install "$udid" "$APP_PATH"
            xcrun simctl status_bar "$udid" override --time "9:41"
            xcrun simctl launch --terminate-running-process "$udid" "$BUNDLE_ID"
            sleep 5
            xcrun simctl io "$udid" screenshot "UIArtifacts/${label}.png"
            xcrun simctl get_app_container "$udid" "$BUNDLE_ID" app
            xcrun simctl terminate "$udid" "$BUNDLE_ID"
            xcrun simctl shutdown "$udid"
          }

          smoke_profile \
            "small" \
            "${{ steps.simulator.outputs.small_udid }}" \
            "${{ steps.simulator.outputs.small_name }}"
          smoke_profile \
            "common" \
            "${{ steps.simulator.outputs.common_udid }}" \
            "${{ steps.simulator.outputs.common_name }}"
          smoke_profile \
            "large" \
            "${{ steps.simulator.outputs.large_udid }}" \
            "${{ steps.simulator.outputs.large_name }}"

      - name: Gate 3 — Unsigned Release simulator build
        id: release_build
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PersonalMissionControl.xcodeproj \
            -scheme PersonalMissionControl \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData-Release \
            -resultBundlePath TestResults/PersonalMissionControl-Release.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 \
            | tee Logs/ios-release-build.log

      - name: Summarize validation gates
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## macOS validation gates"
            echo
            echo "| Gate | Outcome |"
            echo "|---|---|"
            echo "| Core Swift package tests | ${{ steps.core_tests.outcome }} |"
            echo "| Simulator selection | ${{ steps.simulator.outcome }} |"
            echo "| iOS simulator tests | ${{ steps.simulator_tests.outcome }} |"
            echo "| Debug multi-size UI smoke | ${{ steps.ui_smoke.outcome }} |"
            echo "| Unsigned Release build | ${{ steps.release_build.outcome }} |"
            echo
            echo "Simulator: ${{ steps.simulator.outputs.name }}"
            echo "Runtime: ${{ steps.simulator.outputs.runtime }}"
            echo "UI profiles: ${{ steps.simulator.outputs.small_name }}, ${{ steps.simulator.outputs.common_name }}, ${{ steps.simulator.outputs.large_name }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI smoke screenshots
        if: ${{ always() && steps.ui_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: UIArtifacts/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: ${{ failure() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-validation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Logs/
            TestResults/*.xcresult
            UIArtifacts/
          if-no-files-found: ignore
          retention-days: 7
